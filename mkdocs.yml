site_name: Jellycuts Documentation
site_url: https://jellycuts.com/docs

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
  features:
    - navigation.instant

nav:
  - Home: index.md
  - Getting Started:
      - Language Overview: getting-started/language-overview.md
      - Writing Your First Script: getting-started/writing-first-script.md
  - Language Guide:
      - Basics: language-guide/basics.md
      - Variables: language-guide/variables.md
      - Strings: language-guide/strings.md
      - Metadata: language-guide/metadata.md
  - Libraries:
      - Jellycuts:
          - Grab Jellycut: libraries/jellycuts/grab-jellycut.md

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true