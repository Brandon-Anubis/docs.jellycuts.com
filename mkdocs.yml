site_name: Jellycuts Documentation
site_url: https://jellycuts.com/docs

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
  features:
    - navigation.instant

nav:
  - Home: index.md
  - Getting Started:
      - Language Overview: getting-started/language-overview.md
  - Libraries:
      - Jellycuts:
          - Grab Jellycut: libraries/jellycuts/grab-jellycut.md

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true